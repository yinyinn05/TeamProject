<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-color: #f9f9f9;
        }

        h1 {
            color: #333;
            margin-top: 30px;
        }

        img {
            max-width: 100%;
            height: auto;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        p {
            font-size: 16px;
            line-height: 1.5;
            max-width: 800px;
        }

        .prompt-box {
            background: #fff;
            padding: 15px;
            border-left: 4px solid #4CAF50;
            margin: 10px 0;
            width: 100%;
            max-width: 800px;
            box-sizing: border-box;
        }

        .prompt-box.negative {
            border-left-color: #f44336;
        }
    </style>
</head>
<body>

    <h1>原圖 </h1>
    <img src="assets/before.jpg" alt="">

    <h1>生成的圖 </h1>
    <img src="assets/after.jpg.png" alt="">

    <h1>完整工作流截圖 </h1>
    <img src="assets/workflow.png" alt="">

    <h1>我的心得 </h1>
    <p>
        我覺得很有興趣
    </p>

</body>
</html>
